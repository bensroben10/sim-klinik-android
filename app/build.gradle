plugins {
    id 'com.android.application'
}

android {
    namespace 'id.krianapps.simklinik'
    compileSdk 35

    defaultConfig {
        applicationId 'id.krianapps.simklinik'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'
}
